name: SDK
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.12.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - run: npm ci
      - run: npm test
      - run: git diff --exit-code -- src/generated.ts contracts/mock.schema.json vendor/schema
      - run: npm pack --dry-run
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - run: npm ci
      - run: npm run test:bun
